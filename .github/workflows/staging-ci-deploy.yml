name: MST Academy Frontend Staging CI and Build

on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: mst-academy-frontend-staging
  cancel-in-progress: false

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Verification
        run: npm run build

  staging-build:
    name: Update and Build Staging
    runs-on: ubuntu-latest
    needs: frontend-ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    environment:
      name: staging

    steps:
      - name: Prepare SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update Code and Build on Staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/staging_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$STAGING_USER@$STAGING_HOST" \
            'bash -se' <<'REMOTE'
          set -eu

          cd /home/saroj/mst-academy-frontend-staging

          git fetch origin staging
          git merge --ff-only origin/staging

          npm ci
          npm run build

          echo "Staging build completed successfully."
          REMOTE

      - name: Remove SSH Key
        if: always()
        run: rm -f ~/.ssh/staging_key
